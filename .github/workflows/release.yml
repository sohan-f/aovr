name: Release Termux Package

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

permissions:
  contents: write

jobs:
  build-termux-deb:
    name: Build Termux .deb (aarch64-linux-android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Extract Tag Version
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # The NDK location differs between runner image versions; probe the
      # known environment variables instead of assuming ANDROID_NDK_HOME.
      - name: Locate Android NDK linker
        id: ndk
        run: |
          for root in "$ANDROID_NDK_HOME" "$ANDROID_NDK_ROOT" "$ANDROID_NDK_LATEST_HOME" "$ANDROID_NDK_HOME_ROOT"; do
            [ -n "$root" ] || continue
            for bin in "$root"/toolchains/llvm/prebuilt/*/bin; do
              if [ -x "$bin/aarch64-linux-android24-clang" ]; then
                echo "linker=$bin/aarch64-linux-android24-clang" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo "Android NDK with an aarch64 clang toolchain was not found" >&2
          env | grep -i '^ANDROID_' >&2 || true
          exit 1

      - name: Build Binary for Android (aarch64)
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${{ steps.ndk.outputs.linker }}"
          cargo build --locked --release --no-default-features --target aarch64-linux-android

      - name: Verify release binary is virtual-free
        run: |
          bin=target/aarch64-linux-android/release/aovr
          file "$bin" | grep -q aarch64 || { echo "not an aarch64 binary" >&2; exit 1; }
          for marker in 'IconifyComponentNFN' 'virtual ·' 'AOVR_TARGETS_FILE' 'in-memory'; do
            if grep -a -qF "$marker" "$bin"; then
              echo "release binary contains virtual residue: $marker" >&2
              exit 1
            fi
          done
          echo "release binary is virtual-free"

      - name: Prepare Termux .deb Package Directory Structure
        run: |
          PKG_NAME="aovr_${{ env.VERSION }}_aarch64"
          BUILD_DIR="build_deb/${PKG_NAME}"

          TERMUX_BIN_DIR="${BUILD_DIR}/data/data/com.termux/files/usr/bin"
          DEBIAN_DIR="${BUILD_DIR}/DEBIAN"

          mkdir -p "${TERMUX_BIN_DIR}"
          mkdir -p "${DEBIAN_DIR}"

          cp target/aarch64-linux-android/release/aovr "${TERMUX_BIN_DIR}/aovr"
          chmod 755 "${TERMUX_BIN_DIR}/aovr"

          cat <<EOF > "${DEBIAN_DIR}/control"
          Package: aovr
          Version: ${{ env.VERSION }}
          Architecture: aarch64
          Maintainer: Sohan <sohan@users.noreply.github.com>
          Installed-Size: $(du -ks "${BUILD_DIR}/data" | cut -f1)
          Section: utils
          Priority: optional
          Homepage: https://github.com/${{ github.repository }}
          Description: Terminal User Interface (TUI) for interactively managing Android Runtime Overlays in Termux.
          EOF

      - name: Build .deb Package
        run: |
          PKG_NAME="aovr_${{ env.VERSION }}_aarch64"
          dpkg-deb --build "build_deb/${PKG_NAME}" "${PKG_NAME}.deb"

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aovr_${{ env.VERSION }}_aarch64.deb
            target/aarch64-linux-android/release/aovr
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
